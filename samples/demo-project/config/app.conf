# Deliberately weak sample configuration for the ECDAT demo.

[service]
name = demo-project
tls_cert = certs/server.crt
tls_key = certs/server.key
cipher_suites = ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA
group_curves = secp256r1

[crypto]
# Legacy Diffie-Hellman parameters shared during the key exchange.
dh_parameters = dhparam-1024.pem
# Preferred suite for new deployments.
preferred = ChaCha20-Poly1305

[tls]
provider = OpenSSL 3.0
ecdh_curves = prime256v1
